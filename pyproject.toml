[project]
name = "bivio"
version = "0.1.0"
description = "Decisioni tipizzate da un modello linguistico, in locale, senza generare un token. La versione libera dell'idea di Jev."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Federico Boggia", email = "federico@binatomy.com" }]
keywords = ["llm", "classificazione", "logit", "jev", "system-one", "llama.cpp", "locale"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Natural Language :: Italian",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "llama-cpp-python>=0.3.2",
  "numpy>=1.24",
]

[project.optional-dependencies]
prove = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/TheRealF/bivio"
Corso = "https://federicoboggia.binatomy.com/corsi/automazione-processi/"

[project.scripts]
bivio = "bivio.cli:principale"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bivio = ["web/*.html", "griglie/*.json"]
